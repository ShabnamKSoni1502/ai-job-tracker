version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "5433:5432"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/jobtracker
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=5000
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=jobtracker
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: